name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Build Windows
        if: runner.os == 'Windows'
        run: flutter build windows --release

      - name: Build Linux
        if: runner.os == 'Linux'
        run: flutter build linux --release

      - name: Build macOS
        if: runner.os == 'macOS'
        run: flutter build macos --release

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath ffcraft-windows-x64.zip

      - name: Package Linux
        if: runner.os == 'Linux'
        run: tar -C build/linux/x64/release/bundle -czf ffcraft-linux-x64.tar.gz .

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          cd build/macos/Build/Products/Release
          zip -r ../../../../../ffcraft-macos.zip FFCraft.app

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ffcraft-${{ runner.os }}
          if-no-files-found: error
          path: |
            ffcraft-windows-x64.zip
            ffcraft-linux-x64.tar.gz
            ffcraft-macos.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" artifacts/*/* --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
